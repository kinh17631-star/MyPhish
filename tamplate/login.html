<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPhish - Secure Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .login-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); width: 300px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>App Login Test</h2>
        <!-- Data POST method se hamare local server par jayega -->
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Enter Test Username" required>
            <input type="password" name="password" placeholder="Enter Test Password" required>
            <button type="submit">Secure Login</button>
        </form>
    </div>
</body>
</html>
